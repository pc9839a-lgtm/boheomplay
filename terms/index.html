<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>이용약관 | 보험플레이</title><meta name="description" content="보험플레이 이용약관입니다."/><link rel="canonical" href="https://boheomplay.pages.dev/terms/"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/><link rel="stylesheet" href="/assets/css/styles.css?v=20260709-seo"/></head><body><main class="section"><div class="wrap"><article class="article-card"><h1>이용약관</h1><p>보험플레이는 보험 관련 일반 정보와 상담 신청 연결 기능을 제공합니다.</p><h2>정보 제공의 한계</h2><p>사이트 내 정보는 일반적인 안내이며, 특정 보험상품의 가입을 보장하거나 보험료와 보장 내용을 확정하지 않습니다.</p><h2>상담 신청</h2><p>상담 신청 내용은 문의 응대 목적으로 활용되며, 실제 상담 결과는 개인의 연령, 병력, 직업, 기존 계약, 보험사 인수 기준에 따라 달라질 수 있습니다.</p></article></div></main></body></html>
