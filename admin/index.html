<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>보험플레이 관리자</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260710-kv-board" />
  <link rel="stylesheet" href="/assets/css/admin.css?v=20260710-kv-board" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/admin/" aria-label="보험플레이 관리자">관리자</a>
      <nav class="nav"><a href="/" rel="nofollow">공개 페이지</a></nav>
    </div>
  </header>

  <main>
    <section class="board-section">
      <div class="wrap">
        <div class="write-title" style="margin-bottom:24px">
          <span>ADMIN BOARD</span>
          <h2>질문 답변 관리</h2>
          <p>공개 질문은 답변 저장 후 상세 게시글 페이지에 바로 반영됩니다.</p>
        </div>

        <div class="admin-page-login" id="adminGate">
          <strong>관리자 로그인</strong>
          <p>비밀번호는 공개 파일에 저장하지 않고 Cloudflare 환경변수로 확인합니다.</p>
          <form id="adminLoginForm" class="admin-login-form">
            <input type="password" id="adminPasswordInput" placeholder="관리자 비밀번호" autocomplete="current-password" />
            <button type="submit">로그인</button>
          </form>
          <p class="form-result" id="adminLoginResult" role="status"></p>
        </div>

        <div class="admin-page-panel" id="adminPanel" hidden>
          <div class="admin-panel-head">
            <div><strong>관리자 모드</strong><p>답변 작성, 답변 수정, 질문 삭제를 할 수 있습니다.</p></div>
            <button type="button" id="adminLogoutButton">로그아웃</button>
          </div>
          <div class="board-list" id="adminBoardList" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/assets/js/admin-login-diagnostic.js?v=20260715-v1"></script>
  <script src="/assets/js/admin.js?v=20260715-login-errors"></script>
</body>
</html>
