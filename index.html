<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="index,follow,max-image-preview:large" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />

  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"Organization",
    "name":"보험플레이",
    "url":"https://boheomplay.pages.dev/",
    "legalName":"WAYZI(보험플레이)",
    "founder":"김도윤",
    "taxID":"538-42-01450"
  }
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="보험플레이 홈">보험플레이</a>
      <button class="menu-btn" type="button" aria-label="메뉴 열기" data-menu-toggle><span></span><span></span><span></span></button>
      <nav class="nav" data-nav>
        <a href="#board">질문게시판</a>
        <a href="#write">질문남기기</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="board-hero">
      <div class="wrap board-hero-inner">
        <span class="hero-kicker">보험 질문 게시판</span>
        <h1>보험이 헷갈릴 때<br />먼저 질문해보세요</h1>
        <p>실비보험, 암보험, 유병자보험, 부모님 보험까지<br />궁금한 내용을 게시글로 남기고 답변을 확인할 수 있습니다.</p>
        <div class="hero-button-row">
          <a class="hero-primary" href="#write">질문 남기기</a>
          <a class="hero-secondary" href="#board">최근 질문 보기</a>
        </div>
      </div>
    </section>

    <section class="board-section" id="board">
      <div class="wrap">
        <div class="board-toolbar">
          <div class="board-tabs" id="boardTabs" aria-label="보험 질문 분류">
            <button type="button" class="is-active" data-filter="전체">전체</button>
            <button type="button" data-filter="실비보험">실비보험</button>
            <button type="button" data-filter="암보험">암보험</button>
            <button type="button" data-filter="보험료">보험료</button>
            <button type="button" data-filter="유병자보험">유병자보험</button>
            <button type="button" data-filter="부모님 보험">부모님 보험</button>
            <button type="button" data-filter="태아보험">태아보험</button>
          </div>
          <a class="write-button" href="#write">질문 남기기</a>
        </div>

        <div class="board-table" aria-live="polite">
          <div class="board-head" aria-hidden="true">
            <span>번호</span>
            <span>분류</span>
            <span>제목</span>
            <span>상태</span>
            <span>작성일</span>
          </div>
          <div class="board-list" id="boardList"></div>
        </div>
      </div>
    </section>

    <section class="write-section" id="write">
      <div class="wrap write-wrap">
        <div class="write-card">
          <div class="write-title">
            <span>WRITE</span>
            <h2>질문 남기기</h2>
            <p>공개 질문은 게시판에 노출됩니다. 비공개 질문은 연락처를 남겨주세요.</p>
          </div>
          <form class="question-form" id="questionForm" method="POST" novalidate>
            <div class="visibility-toggle" aria-label="공개 여부">
              <label><input type="radio" name="visibility" value="public" checked /> <span>공개 질문</span></label>
              <label><input type="radio" name="visibility" value="private" /> <span>비공개 질문</span></label>
            </div>

            <div class="private-fields" id="privateFields" hidden>
              <div class="private-notice">비공개 질문은 답변 안내를 위해 이름과 연락처를 받습니다.</div>
              <div class="form-row">
                <label><span>이름 *</span><input name="private_name" id="privateNameInput" placeholder="이름" autocomplete="name" /></label>
                <label><span>전화번호 *</span><input name="private_phone" id="privatePhoneInput" placeholder="숫자만 입력" inputmode="numeric" autocomplete="tel" /></label>
              </div>
            </div>

            <div class="form-row">
              <label><span>분류 *</span><select name="category" required><option value="">선택</option><option>실비보험</option><option>암보험</option><option>보험료</option><option>유병자보험</option><option>부모님 보험</option><option>태아보험</option><option>운전자보험</option><option>치아보험</option><option>기타</option></select></label>
              <label><span>닉네임</span><input name="nickname" placeholder="익명 가능" /></label>
            </div>
            <label><span>제목 *</span><input name="title" required maxlength="80" placeholder="예: 실비보험료가 갑자기 올랐는데 유지해야 할까요?" /></label>
            <label><span>질문 내용 *</span><textarea name="message" required rows="5" maxlength="800" placeholder="현재 상황을 짧게 남겨주세요."></textarea></label>
            <input class="bot-field" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <input type="hidden" name="page_url" id="landingPageInput" />
            <input type="hidden" name="referrer" id="referrerInput" />
            <input type="hidden" name="utm_source" id="utmSourceInput" />
            <input type="hidden" name="utm_medium" id="utmMediumInput" />
            <input type="hidden" name="utm_campaign" id="utmCampaignInput" />
            <button class="submit-button" type="submit">게시글 올리기</button>
            <p class="form-result" id="questionResult" role="status"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p><strong>WAYZI(보험플레이)</strong> · 대표 김도윤 · 사업자번호 538-42-01450</p>
      <nav><a href="/privacy/">개인정보처리방침</a><a href="/terms/">이용약관</a></nav>
    </div>
  </footer>

  <script src="/assets/js/config.js?v=20260709-private-board"></script>
  <script src="/assets/js/main.js?v=20260709-private-board"></script>
</body>
</html>
