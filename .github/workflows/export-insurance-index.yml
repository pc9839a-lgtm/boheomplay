name: Finalize insurance publication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Validate and update index
        run: python scripts/finalize-insurance-2026-07-19.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- content/insurance-seo-index.json functions/sitemap.xml.js; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/insurance-seo-index.json functions/sitemap.xml.js
          git commit -m "Finalize insurance SEO index for 2026-07-19"
          git push origin HEAD:${{ github.head_ref }}
