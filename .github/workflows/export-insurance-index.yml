name: Export insurance index

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Upload source files
        uses: actions/upload-artifact@v4
        with:
          name: insurance-repo-snapshot
          path: |
            content/insurance-seo-index.json
            functions/_content.js
            functions/_extra-qa.js
            functions/_daily-questions.js
            functions/_qa-*.js
            functions/_insurance-directory.js
            functions/_unified-question.js
            functions/q/[slug].js
            functions/q/_middleware.js
            functions/sitemap.xml.js
          if-no-files-found: error
