<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>보험플레이 소개 | 보험 질문 기반 상담 허브</title><meta name="description" content="보험플레이는 보험 질문을 쉽게 정리하고 상담 신청으로 연결하는 보험 정보·상담 허브입니다."/><link rel="canonical" href="https://boheomplay.pages.dev/about/"/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/><link rel="stylesheet" href="/assets/css/styles.css?v=20260709-seo"/></head><body><header class="site-header"><div class="wrap header-inner"><a class="brand" href="/"><span class="brand-mark">B</span><strong>보험플레이</strong></a><nav class="nav"><a href="/">홈</a><a href="/#contact" class="nav-cta">상담 신청</a></nav></div></header><main><section class="content-hero"><div class="wrap"><span class="eyebrow">ABOUT</span><h1>보험플레이는 보험 고민을 질문부터 정리합니다.</h1><p>보험 상품을 먼저 보여주기보다, 사용자가 실제로 검색하는 질문을 기준으로 유지·해지·가입·리모델링 판단 기준을 안내합니다.</p></div></section><section class="section"><div class="wrap"><article class="article-card"><h2>운영 방향</h2><p>보험플레이는 실비보험, 암보험, 유병자보험, 태아보험, 부모님 보험 등 자주 묻는 보험 질문을 정리하고 상담 신청으로 연결하는 정보형 사이트입니다.</p><p>특정 상품을 확정 추천하거나 보험료를 단정하지 않으며, 개인 조건에 따라 상담 결과가 달라질 수 있음을 안내합니다.</p></article></div></section></main></body></html>
